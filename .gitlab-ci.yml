variables:
    GIT_DEPTH: "20"

# FULL build of the whole solution, including the MAUI head
# (net9.0-android / net9.0-ios / net9.0-maccatalyst) + Web + Wasm.
# iOS & MacCatalyst require macOS + Xcode, so this runs on the tagged Mac runner.
full-build:
    stage: build          # register a macOS shell runner with this tag
    before_script:
        # The .sln references sibling repos via ..\..\<Module> — i.e. TWO levels
        # above Kmila.sln. Clone them there so MSBuild resolves the paths.
        - cd "$CI_PROJECT_DIR"
        - |
          for m in Interpreter LibraryCompiler Debugger TimeMachine Parser; do
            rm -rf "../../$m"
            git clone --depth 20 \
              "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/$m.git" \
              "../../$m"
          done
    script:
        # installs whatever workloads the solution needs (maui + wasm-tools) on the Mac
        - dotnet workload restore Kmila.sln
        - cd Kmila.Web
        - dotnet build -c Release -f net9.0
        - cd ..
        - cd Kmila
        - dotnet build -c Release -f net9.0-android
        - cd ..
        - cd Kmila.Wasm
        - dotnet build -c Release -f net9.0
