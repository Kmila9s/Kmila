stages:
    - build

variables:
    GIT_DEPTH: "20"

# ---------------------------------------------------------------------
# Shared: clone the sibling repos the .sln references via ..\..\<Module>
# (they must sit two levels above Kmila.sln). Spliced into each job with
# GitLab's !reference so there's a single source of truth.
# ---------------------------------------------------------------------
.setup:
    before_script:
        - cd "$CI_PROJECT_DIR"
        - |
          for m in Interpreter LibraryCompiler Debugger TimeMachine Parser; do
            rm -rf "../../$m"
            git clone --depth 20 \
              "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/$m.git" \
              "../../$m"
          done

# =====================================================================
# Pi / arm64 runner — arch-neutral targets only: Web + Wasm.
# .NET Android CANNOT build on arm64 (the Microsoft.Android.Sdk pack
# ships an x86_64-only aapt2 -> XA0111 "Exec format error"), so NO
# net9.0-android / net9.0-ios / net9.0-maccatalyst here.
# =====================================================================
web-wasm-build:
    stage: build
    image: mcr.microsoft.com/dotnet/sdk:9.0
    variables:
        TMPDIR: "$CI_PROJECT_DIR/.tmp"     # keep temp off the Pi's small /tmp tmpfs
    before_script:
        - mkdir -p "$TMPDIR"
        - !reference [.setup, before_script]
        - dotnet workload install maui-android wasm-tools --skip-manifest-update
    script:
        - dotnet build Kmila.Web/Kmila.Web.csproj   -c Release -f net9.0
        - dotnet build Kmila.Wasm/Kmila.Wasm.csproj -c Release -f net9.0

# =====================================================================
# Mac runner (Apple Silicon) — ALL mobile: Android + iOS + MacCatalyst.
# macOS supports the full .NET Android + Apple toolchain. Requires a
# registered macOS runner tagged [macos] with Xcode + .NET 9.
# Left `when: manual` until that runner exists so it never blocks the
# pipeline; flip to automatic once the Mac runner is up.
# =====================================================================
mobile-build:
    stage: build
    tags: [macos]
    when: manual
    before_script:
        - !reference [.setup, before_script]
        - dotnet workload restore Kmila/Kmila.csproj
    script:
        # builds the head's default TFMs: net9.0-android;net9.0-ios;net9.0-maccatalyst
        - dotnet build Kmila/Kmila.csproj -c Release
