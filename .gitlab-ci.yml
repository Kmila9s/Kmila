stages:
    - build
    - package

variables:
    GIT_DEPTH: "20"

# ---------------------------------------------------------------------
# Shared: clone the sibling repos the .sln references via ..\..\<Module>
# (they must sit two levels above Kmila.sln). Used by the dotnet build job.
# ---------------------------------------------------------------------
.setup:
    before_script:
        - cd "$CI_PROJECT_DIR"
        - |
          for m in Interpreter LibraryCompiler Debugger TimeMachine Parser; do
            rm -rf "../../$m"
            git clone --depth 20 \
              "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/$m.git" \
              "../../$m"
          done

# =====================================================================
# Compile the web targets (fast feedback). Arch-neutral -> runs on the Pi.
# NOTE: no mobile here. .NET Android can't build on arm64 (x86_64 aapt2 in
# the pack) and iOS/MacCatalyst need macOS — both intentionally skipped.
# =====================================================================
web-wasm-build:
    stage: build
    image: mcr.microsoft.com/dotnet/sdk:9.0
    variables:
        TMPDIR: "$CI_PROJECT_DIR/.tmp"     # keep temp off the Pi's small /tmp tmpfs
    before_script:
        - mkdir -p "$TMPDIR"
        # Blazor WASM native relink (e_sqlite3 -> wasm via Emscripten) needs python;
        # the dotnet SDK image doesn't ship it. Provide `python` (not just python3).
        - apt-get update && apt-get install -y --no-install-recommends python3
        - ln -sf /usr/bin/python3 /usr/local/bin/python
        - !reference [.setup, before_script]
        - dotnet workload install maui-android wasm-tools
    script:
        - dotnet build Kmila.Web/Kmila.Web.csproj   -c Release -f net9.0
        - cd Kmila.Wasm
        - dotnet build -c Release -f net9.0

# =====================================================================
# Build the Docker images (Web = Blazor Server, Wasm = static nginx).
# Both Dockerfiles need the MONOREPO layout as context: App/Kmila/ plus the
# sibling module dirs at the context root. We assemble that here.
# Needs a Docker-capable runner (docker-in-docker service below).
# Pushes to Docker Hub only if DOCKERHUB_USER / DOCKERHUB_TOKEN are set.
# =====================================================================
docker-build:
    stage: package
    needs: ["web-wasm-build"]
    image: docker:27
    services:
        - docker:27-dind
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    before_script:
        - apk add --no-cache git
        - export CTX="$CI_PROJECT_DIR/../_dockerctx"
        - rm -rf "$CTX"; mkdir -p "$CTX/App/Kmila"
        # the Kmila repo (this checkout) provides App/Kmila/*
        - cp -a "$CI_PROJECT_DIR/." "$CTX/App/Kmila/"
        # sibling module repos go at the context root, matching the Dockerfile COPYs
        - |
          for m in Debugger Interpreter LibraryCompiler Parser TimeMachine; do
            git clone --depth 20 \
              "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/$m.git" \
              "$CTX/$m"
          done
    script:
        - export TAG="${CI_COMMIT_SHORT_SHA}"
        - docker build -f "$CTX/App/Kmila/deploy/Dockerfile"            -t "kmila-web:$TAG"  "$CTX"
        - docker build -f "$CTX/App/Kmila/Kmila.Wasm/deploy/Dockerfile" -t "kmila-wasm:$TAG" "$CTX"
        - |
          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
            docker tag  "kmila-web:$TAG"  "$DOCKERHUB_USER/kmila-web:$TAG"
            docker tag  "kmila-wasm:$TAG" "$DOCKERHUB_USER/kmila-wasm:$TAG"
            docker push "$DOCKERHUB_USER/kmila-web:$TAG"
            docker push "$DOCKERHUB_USER/kmila-wasm:$TAG"
          else
            echo "DOCKERHUB_USER/DOCKERHUB_TOKEN not set -> built images locally, skipping push."
          fi
