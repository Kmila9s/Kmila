    <!-- Mermaid diagram rendering (shared with the other hosts via the same API). -->
    <script type="module">
        import mermaid from '/_content/Kmila.Shared/lib/mermaid/mermaid.esm.min.mjs';
        const cssVar = (name, fallback) => {
            const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            return v || fallback;
        };
        const kmilaMermaidConfig = () => {
            const dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            return {
                startOnLoad: false,
                securityLevel: 'strict',
                theme: 'base',
                // Big control-flow diagrams hit Mermaid's default ceilings
                // (maxEdges:500, maxTextSize:50000) and fall back to a "Syntax
                // error" box. Raise them so large designs render. flowchart.
                // useMaxWidth:false stops Mermaid from shrinking wide diagrams
                // to the column width; the viewer's pan-zoom handles size.
                maxEdges: 2000,
                maxTextSize: 200000,
                flowchart: {
                    useMaxWidth: false,
                    htmlLabels: true,
                    nodeSpacing: 40,
                    rankSpacing: 50,
                    padding: 12,
                },
                themeVariables: {
                    fontFamily: cssVar('--font-sans', 'system-ui, sans-serif'),
                    background: cssVar('--surface-1', dark ? '#0f172a' : '#ffffff'),
                    primaryColor: cssVar('--surface-2', dark ? '#1e293b' : '#f1f5f9'),
                    primaryTextColor: cssVar('--text-strong', dark ? '#f8fafc' : '#0f172a'),
                    primaryBorderColor: cssVar('--kmila-accent', '#1f57c4'),
                    lineColor: cssVar('--text-muted', dark ? '#94a3b8' : '#64748b'),
                    secondaryColor: cssVar('--surface-3', dark ? '#334155' : '#e2e8f0'),
                    tertiaryColor: cssVar('--surface-2', dark ? '#1e293b' : '#f8fafc'),
                    textColor: cssVar('--text-default', dark ? '#e2e8f0' : '#1e293b'),
                },
            };
        };
        mermaid.initialize(kmilaMermaidConfig());
        let mermaidRunning = false;
        let mermaidPending = false;
        window.kmilaMermaidRun = async function () {
            if (mermaidRunning) { mermaidPending = true; return; }
            mermaidRunning = true;
            try {
                do {
                    mermaidPending = false;
                    await new Promise(r => requestAnimationFrame(r));
                    const nodes = Array.from(document.querySelectorAll('pre.mermaid:not([data-processed])'));
                    for (const el of nodes) {
                        if (!el.hasAttribute('data-kmila-mermaid-src')) {
                            el.setAttribute('data-kmila-mermaid-src', el.textContent || '');
                        }
                    }
                    for (const el of nodes) {
                        const src = el.getAttribute('data-kmila-mermaid-src') || '';
                        try {
                            await mermaid.parse(src);
                            await mermaid.run({ nodes: [el] });
                            el.removeAttribute('data-kmila-mermaid-error');
                        } catch (e) {
                            console.warn('[mermaid]', e, src.slice(0, 80));
                            el.removeAttribute('data-processed');
                            // Mark the node so the export path (and any debugging)
                            // can tell "render failed" apart from "still rendering"
                            // instead of silently leaving raw text behind.
                            el.setAttribute('data-kmila-mermaid-error', (e && e.message) ? e.message : 'render error');
                        }
                    }
                } while (mermaidPending);
            } finally {
                mermaidRunning = false;
            }
        };
        new MutationObserver(() => {
            mermaid.initialize(kmilaMermaidConfig());
            document.querySelectorAll('pre.mermaid').forEach(el => {
                var src = el.getAttribute('data-kmila-mermaid-src');
                if (src !== null) el.textContent = src;
                el.removeAttribute('data-processed');
            });
            window.kmilaMermaidRun();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });
        window.addEventListener('load', () => window.kmilaMermaidRun());
    </script>

    <!-- Boot-splash localization. This runs BEFORE the WASM runtime / Traductor
         load, so it cannot use the app dictionaries; it carries its own tiny
         table for just these four strings and picks a language from
         navigator.language (English fallback). Once Blazor mounts it replaces
         #app and manages language/RTL itself. -->
    <script>
        (function () {
            var S = {
                en: { load: "Loading Kmila…", sub: "Compiling the VHDL engine in your browser", err: "An unhandled error has occurred.", reload: "Reload" },
                es: { load: "Cargando Kmila…", sub: "Compilando el motor VHDL en tu navegador", err: "Se produjo un error no controlado.", reload: "Recargar" },
                fr: { load: "Chargement de Kmila…", sub: "Compilation du moteur VHDL dans votre navigateur", err: "Une erreur non gérée s'est produite.", reload: "Recharger" },
                de: { load: "Kmila wird geladen…", sub: "Die VHDL-Engine wird in deinem Browser kompiliert", err: "Ein unbehandelter Fehler ist aufgetreten.", reload: "Neu laden" },
                jp: { load: "Kmila を読み込み中…", sub: "ブラウザーで VHDL エンジンをコンパイルしています", err: "未処理のエラーが発生しました。", reload: "再読み込み" },
                ch: { load: "正在加载 Kmila…", sub: "正在你的浏览器中编译 VHDL 引擎", err: "发生了未处理的错误。", reload: "重新加载" },
                ar: { load: "جارٍ تحميل Kmila…", sub: "يجري تجميع محرّك VHDL في متصفّحك", err: "حدث خطأ غير معالَج.", reload: "إعادة التحميل" }
            };
            var raw = (navigator.language || "en").toLowerCase().slice(0, 2);
            var code = ({ zh: "ch", ja: "jp" })[raw] || raw;
            var t = S[code] || S.en;
            try {
                document.documentElement.lang = code;
                var q = function (s) { return document.querySelector(s); };
                var a = q(".kmila-boot-label"); if (a) a.textContent = t.load;
                var b = q(".kmila-boot-sub"); if (b) b.textContent = t.sub;
                var e = q("#blazor-error-text"); if (e) e.textContent = t.err;
                var r = q("#blazor-error-ui .reload"); if (r) r.textContent = t.reload;
                if (code === "ar") {
                    var boot = q(".kmila-boot"); if (boot) boot.dir = "rtl";
                    var eui = q("#blazor-error-ui"); if (eui) eui.dir = "rtl";
                }
            } catch (_) { }
        })();
    </script>

    <!-- Run Monaco's language services on the main thread. Avoids first-run
         worker-URL/cross-origin surprises on a static host; language services
         are slightly slower but correct, which is what a demo wants. -->
    <script>

        var stubUrl = URL.createObjectURL(new Blob([''], { type: 'application/javascript' }));
        window.MonacoEnvironment = window.MonacoEnvironment || {};
        window.MonacoEnvironment.getWorkerUrl = function () { return stubUrl; };
        window.MonacoEnvironment.getWorker = function () { return new Worker(stubUrl); };
      })();
    </script>
