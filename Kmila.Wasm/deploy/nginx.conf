# nginx config for the Kmila.Wasm static demo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor's .NET 9 assets are .wasm (runtime + Webcil-wrapped assemblies).
    # Correct MIME lets the browser stream-compile the wasm. (nginx:alpine's
    # bundled mime.types already maps most of these; this block is belt-and-braces.)
    types {
        application/wasm            wasm;
        application/octet-stream    dat blat;
        application/json            json;
        application/javascript      js mjs;
        text/css                    css;
    }
    default_type application/octet-stream;

    # Serve Blazor's precompressed .gz siblings when the client accepts gzip,
    # so the ~large framework payload transfers small. (.br needs a custom nginx
    # build with ngx_brotli; gzip_static is built in and covers the common case.)
    gzip_static on;

    # Long-cache the fingerprinted framework assets; they change name on rebuild.
    location /_framework/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The runtime dictionaries (translations + the APP_VERSION stamp) are NOT
    # fingerprinted — Traductor fetches them by literal path. Keep them revalidated
    # so a redeploy's new translations/version show immediately instead of lingering
    # for up to the /_content/ max-age. (Longest-prefix match wins over /_content/.)
    location /_content/Kmila.Shared/Dictionaries/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /_content/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback — Blazor does client-side routing, so unknown paths must
    # return index.html (never a 404 for a real in-app route like /editor/1).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
