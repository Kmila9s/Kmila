.gate-lamp{fill:var(--anatomy-shade-2);stroke:var(--anatomy-lo);stroke-width:.6;transition:fill .18s ease,stroke .18s ease}
.gate-lamp[data-on="1"]{fill:var(--anatomy-lit);stroke:var(--anatomy-lit);filter:drop-shadow(0 0 4px var(--anatomy-lit))}

.tt-panel{fill:var(--anatomy-card);stroke:var(--anatomy-faint);stroke-width:1}
.tt-head{fill:var(--anatomy-muted);font:600 12px var(--anatomy-mono);letter-spacing:.14em}

.tl-lab{text-anchor:start;font:600 10px var(--anatomy-mono);fill:var(--anatomy-muted);letter-spacing:.06em}

.ex-code{font-size:11px}

.ex-shutter{fill:var(--anatomy-shade-2);stroke:var(--anatomy-lo);stroke-width:.4}
.ex-shutter[data-on="1"]{fill:var(--anatomy-lit);filter:drop-shadow(0 0 4px var(--anatomy-lit))}
.ex-softbox{fill:var(--anatomy-shade-3);stroke:var(--anatomy-lo);stroke-width:.6;transition:fill .12s ease}
.ex-softbox[data-on="1"]{fill:#fff;filter:drop-shadow(0 0 8px #fff)}
.ex-draft{opacity:0;transition:opacity .25s ease}
.ex-draft[data-on="1"]{opacity:1}
.ex-flash{fill:#fff;opacity:0;pointer-events:none;mix-blend-mode:soft-light}

.ex-outpost .iso-face-text{transition:fill .3s ease}
.ex-outpost[data-on="1"] .iso-face-text[data-out]{fill:var(--anatomy-lit)}
.ex-outpost[data-on="1"]{filter:drop-shadow(0 0 4px var(--anatomy-lit))}
body[data-theme="light"] .ex-flash{opacity:0 !important}
/* doorbell */
.ex-window{fill:none;stroke:var(--anatomy-lo);stroke-width:1;transition:stroke .2s ease}
.ex-window[data-on="1"]{stroke:var(--anatomy-lit);stroke-width:1.6;filter:drop-shadow(0 0 3px var(--anatomy-lit))}

.ex-nosocket[data-on="1"]{opacity:1;filter:drop-shadow(0 0 3px var(--anatomy-red))}
.ex-bellbtn[data-on="0"]{opacity:0}
.ex-gaze{fill:none;stroke:var(--anatomy-lit);stroke-width:1.4;stroke-dasharray:2 3;stroke-linecap:round}
.ex-chip{fill:var(--anatomy-mid);font:600 11px var(--anatomy-mono)}
.ex-mode[data-on="1"] .ex-chip{fill:var(--anatomy-strong)}

.ex-water[data-on="1"]{fill:var(--anatomy-lit);filter:drop-shadow(0 0 3px var(--anatomy-lit))}

.ex-delta{fill:var(--anatomy-muted);font:12px var(--anatomy-mono)}

.ex-ri-big{fill:none;stroke:var(--anatomy-mid);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.ex-pendulum{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:1.2;stroke-linecap:round}

const ELEVATION = 30;

const RADIANS = Math.PI / 180;

    const a = azimuth * RADIANS;

    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

    return (x * cosA + y * sinA) * cosE + z * sinE;

const tenth = (value) => {

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const lower = [];

    const upper = [];

function runsOf(flags, want) {
