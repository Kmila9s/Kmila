<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kmila /api/v1 — Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../lib/swagger-ui/swagger-ui.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../lib/swagger-ui/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../lib/swagger-ui/favicon-16x16.png">
  <style>
    html, body { margin: 0; padding: 0; background: #fafafa; }
    body { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="../lib/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="../lib/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "../openapi/v1.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
