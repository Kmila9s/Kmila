    <!-- Mermaid diagram rendering (shared with Web host via the same API).
         Source preservation: mermaid overwrites pre.mermaid innerHTML with
         the rendered SVG, so a theme switch can't simply re-run mermaid on
         the same node — textContent is now SVG markup, parse fails, the
         diagram vanishes. Stash the original source on first sight and
         restore it before re-rendering. (Backlog #7.) -->
    <script type="module">
        import mermaid from '/_content/Kmila.Shared/lib/mermaid/mermaid.esm.min.mjs';
        // Pull live token values from the document so Mermaid blends with
        // whichever theme is active (light / dark / future ones). Falls back
        // to hex literals if the token isn't resolved yet (e.g. first paint).
        const cssVar = (name, fallback) => {
            const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            return v || fallback;
        };
        const kmilaMermaidConfig = () => {
            const dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            return {
                startOnLoad: false,
                securityLevel: 'strict',
                theme: 'base',
                themeVariables: {
                    fontFamily: cssVar('--font-sans', 'system-ui, sans-serif'),
                    background: cssVar('--surface-1', dark ? '#0f172a' : '#ffffff'),
                    primaryColor: cssVar('--surface-2', dark ? '#1e293b' : '#f1f5f9'),
                    primaryTextColor: cssVar('--text-strong', dark ? '#f8fafc' : '#0f172a'),
                    primaryBorderColor: cssVar('--kmila-accent', '#1f57c4'),
                    lineColor: cssVar('--text-muted', dark ? '#94a3b8' : '#64748b'),
                    secondaryColor: cssVar('--surface-3', dark ? '#334155' : '#e2e8f0'),
                    tertiaryColor: cssVar('--surface-2', dark ? '#1e293b' : '#f8fafc'),
                    textColor: cssVar('--text-default', dark ? '#e2e8f0' : '#1e293b'),
                },
            };
        };
        mermaid.initialize(kmilaMermaidConfig());
        // v11.15.0 code-splits diagram grammars into lazy chunks. `mermaid.run`
        // alone can race the first `import()` for the flowchart chunk on
        // hydration — the pre exists but the parser isn't loaded yet, so
        // every diagram falls to the "Syntax error / version 11.15.0" SVG.
        // Awaiting `mermaid.parse(src)` before `run` forces the chunk import
        // to resolve first. Single-flight + pending flag coalesces overlapping
        // calls from load handler, OnAfterRender, and the theme-swap observer.
        let mermaidRunning = false;
        let mermaidPending = false;
        window.kmilaMermaidRun = async function () {
            if (mermaidRunning) { mermaidPending = true; return; }
            mermaidRunning = true;
            try {
                do {
                    mermaidPending = false;
                    await new Promise(r => requestAnimationFrame(r));
                    const nodes = Array.from(document.querySelectorAll('pre.mermaid:not([data-processed])'));
                    for (const el of nodes) {
                        if (!el.hasAttribute('data-kmila-mermaid-src')) {
                            el.setAttribute('data-kmila-mermaid-src', el.textContent || '');
                        }
                    }
                    for (const el of nodes) {
                        const src = el.getAttribute('data-kmila-mermaid-src') || '';
                        try {
                            await mermaid.parse(src);
                            await mermaid.run({ nodes: [el] });
                        } catch (e) {
                            console.warn('[mermaid]', e, src.slice(0, 80));
                            el.removeAttribute('data-processed');
                        }
                    }
                } while (mermaidPending);
            } finally {
                mermaidRunning = false;
            }
        };
        new MutationObserver(() => {
            mermaid.initialize(kmilaMermaidConfig());
            document.querySelectorAll('pre.mermaid').forEach(el => {
                var src = el.getAttribute('data-kmila-mermaid-src');
                if (src !== null) el.textContent = src;
                el.removeAttribute('data-processed');
            });
            window.kmilaMermaidRun();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });
        window.addEventListener('load', () => window.kmilaMermaidRun());
    </script>

    <!-- Suppress the cosmetic "An unhandled error has occurred" banner for
         the known non-fatal `e.startsWith is not a function` thrown deep in
         blazor.webview.js on Android WebView (origin: framework's anchor-href
         normalizer occasionally seeing a non-string value). The error is
         swallowed by Blazor's own try/catch internally but its `window.error`
         leak still triggers the banner. Filtering it here keeps the rest of
         Blazor's error reporting intact. -->
    <script>
      window.addEventListener('error', function (ev) {
        if (ev && ev.message && /startsWith is not a function/.test(ev.message)) {
          ev.preventDefault();
          ev.stopImmediatePropagation();
          var bar = document.getElementById('blazor-error-ui');
          if (bar) bar.style.display = 'none';
          return true;
        }
      }, true);
    </script>

    <!-- Disable Monaco web-workers on Android WebView. The framework loads
         workers from `_content/BlazorMonaco/...` via a blob: URL, and the
         resulting WorkerGlobalScope can't `importScripts` back across the
         BlazorWebView virtual host (`0.0.0.1`). The browser logs:
           Failed to execute 'importScripts' on 'WorkerGlobalScope'.
         Return an empty-script Blob URL so the Worker constructor succeeds
         (Workers can't use data: URLs on Android WebView) and Monaco falls
         back to main-thread language services. -->
    <script>
      (function () {
        var stubUrl = URL.createObjectURL(new Blob([''], { type: 'application/javascript' }));
        window.MonacoEnvironment = window.MonacoEnvironment || {};
        window.MonacoEnvironment.getWorkerUrl = function () { return stubUrl; };
        window.MonacoEnvironment.getWorker = function () { return new Worker(stubUrl); };
      })();
    </script>
