    <script>
        window.kmilaResolveTheme = function (input) {
            if (input === 'dark' || input === 'light') return input;
            try {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } catch (_) { return 'light'; }
        };
        (function () {
            try {
                var t = localStorage.getItem('kmila-theme') || 'auto';
                document.documentElement.setAttribute('data-bs-theme', window.kmilaResolveTheme(t));
            } catch (_) {}
        })();
        // Language pointer used by the VHDL Monaco providers for doc strings.
        window.kmilaSetDocsLang = function (lang) {
            window.kmilaCurrentDocsLang = lang || 'en';
            try { localStorage.setItem('kmila-lang', window.kmilaCurrentDocsLang); } catch (_) {}
        };
        try { window.kmilaCurrentDocsLang = localStorage.getItem('kmila-lang') || 'en'; }
        catch (_) { window.kmilaCurrentDocsLang = 'en'; }

        // Close any open <details> popover when the user clicks outside it or
        // hits Escape. Popovers with `data-no-auto-close` opt out.
        document.addEventListener('click', function (e) {
            document.querySelectorAll('details[open]').forEach(function (d) {
                if (d.hasAttribute('data-no-auto-close')) return;
                if (!d.contains(e.target)) d.open = false;
            });
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            document.querySelectorAll('details[open]').forEach(function (d) {
                if (d.hasAttribute('data-no-auto-close')) return;
                d.open = false;
            });
        });
        // Swallow Ctrl+S / Cmd+S on the editor route (capture phase).
        document.addEventListener('keydown', function (e) {
            var isSave = (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey &&
                         (e.key === 's' || e.key === 'S' || e.code === 'KeyS');
            if (!isSave) return;
            if (document.documentElement.getAttribute('data-route') !== 'editor') return;
            e.preventDefault();
            e.stopPropagation();
        }, { capture: true });

        // Push parser diagnostics into Monaco — shared with the Web host.
        window.kmilaSetMonacoMarkers = function (markers) {
            try {
                if (!window.monaco || !window.monaco.editor) return;
                var models = window.monaco.editor.getModels();
                for (var i = 0; i < models.length; i++) {
                    window.monaco.editor.setModelMarkers(models[i], 'kmila-vhdl', markers || []);
                }
            } catch (e) { console.warn('[kmilaSetMonacoMarkers]', e); }
        };

        // Dock grabber drag — shared with the Web host.
        window.kmilaDockDragStart = function (dotnetRef, startY) {
            var dockEl = document.querySelector('.kmila-dock');
            if (!dockEl) return;
            var startHeight = dockEl.getBoundingClientRect().height;
            function onMove(ev) {
                var delta = startY - ev.clientY;
                var next  = Math.max(200, Math.min(1200, Math.round(startHeight + delta)));
                dotnetRef.invokeMethodAsync('OnGrabberMove', next);
            }
            function onUp() {
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup',   onUp);
                dotnetRef.invokeMethodAsync('OnGrabberUp').catch(() => {});
                dotnetRef.dispose();
            }
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup',   onUp);
        };

        // Blob-based download helper (shared Web + MAUI). Used by Settings to
        // export the FPGA / language JSON templates.
        window.kmilaDownloadText = function (fileName, mime, text) {
            try {
                var blob = new Blob([text], { type: mime || 'application/octet-stream' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = fileName || 'kmila-download.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                return true;
            } catch (e) {
                console.error('[kmilaDownloadText] failed', e);
                return false;
            }
        };
    </script>

    <!-- Mermaid diagram rendering (shared with Web host via the same API). -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        const isDark = () => document.documentElement.getAttribute('data-bs-theme') === 'dark';
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'default' });
        window.kmilaMermaidRun = function () {
            try { mermaid.run({ querySelector: 'pre.mermaid' }); } catch (e) { console.warn('[mermaid]', e); }
        };
        new MutationObserver(() => {
            mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'default' });
            document.querySelectorAll('pre.mermaid').forEach(el => { el.removeAttribute('data-processed'); });
            window.kmilaMermaidRun();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });
        window.addEventListener('load', () => window.kmilaMermaidRun());
    </script>
